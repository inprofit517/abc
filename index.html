<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>abc Elektrotechnik AG — Moderne Elektrotechnik</title>
  <meta name="description" content="abc Elektrotechnik AG — Moderne Elektrotechnik. Von der ersten Planung bis zur sicheren Umsetzung." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
<!--
  THESIS: An electrician's first impression is trust under pressure. This hero refuses the bright, busy tradesman-template (checklist cards, stock smiles) for a single cinematic frame: one master at work, lit like a portrait, copy set like industrial signage.
  OWN-WORLD: Near-black warm charcoal ground (#0c0d0a). Logo-green (#67A945) as the only chromatic voice — the mark, the rule under the wordmark, the primary action. Display in Archivo heavy, tight tracking, engineered. Body in Hanken Grotesk. Green-tinted secondary text, never gray.
  STORY: Visitor sees a real, equipped professional emerging from darkness → reads "Moderne Elektrotechnik" → understands the promise (Planung → sichere Umsetzung) → acts: Beratung anfragen or Anrufen.
  FIRST VIEWPORT: Full-height photo, worker right, dark to the left. Navbar (recreated abc mark + green rule) pinned top. Headline block anchored lower-left; H1 oversized, H2 beneath, green button + phone to its right-bottom. Corner spotlight glow top.
  FORM: Cinematic full-bleed hero + transparent navbar; narrow asset-pinned build, no concept roll.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

  <a class="skip-link" href="#hero">Zum Inhalt springen</a>

  <header class="nav" id="top">
    <div class="nav__inner">
      <a class="brand" href="#top" aria-label="abc Elektrotechnik AG — Startseite">
        <img class="brand__img" src="assets/logo.png" width="508" height="292" alt="abc Elektrotechnik AG" />
      </a>

      <nav class="nav__links" aria-label="Hauptnavigation">
        <a href="#leistungen">Leistungen</a>
        <a href="#referenzen">Referenzen</a>
        <a href="#ueber-uns">Über uns</a>
        <a href="#kontakt">Kontakt</a>
      </nav>

      <button class="nav__toggle" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mobile-menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <nav class="mobile-menu__links" aria-label="Mobile Navigation">
      <a href="#leistungen">Leistungen</a>
      <a href="#referenzen">Referenzen</a>
      <a href="#ueber-uns">Über uns</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
    <a class="btn btn--solid btn--lg mobile-menu__cta" href="#kontakt">
      Beratung anfragen
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </a>
  </div>

  <main>
    <section class="hero" id="hero">
      <picture class="hero__media">
        <source media="(max-width: 820px)" srcset="assets/hero-mobile.jpg" />
        <img src="assets/hero-desktop.jpg" alt="Elektrofachmann mit Schutzhelm und Werkzeugkoffer vor einer dunklen Wand, im Spotlicht" fetchpriority="high" />
      </picture>
      <div class="hero__scrim" aria-hidden="true"></div>

      <div class="hero__content">
        <div class="hero__text">
          <h1 class="hero__title">
            <span class="reveal" data-r="1">Moderne</span>
            <span class="reveal" data-r="2">Elektrotechnik</span>
          </h1>
          <p class="hero__sub reveal" data-r="3">Von der ersten Planung bis zur sicheren Umsetzung</p>
        </div>

        <div class="hero__actions reveal" data-r="4">
          <a class="btn btn--solid btn--lg" href="#kontakt">
            Beratung anfragen
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var toggle = document.querySelector('.nav__toggle');
      var menu = document.getElementById('mobile-menu');
      if (!toggle || !menu) return;

      function setOpen(open) {
        document.body.classList.toggle('menu-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Menü schließen' : 'Menü öffnen');
        menu.setAttribute('aria-hidden', open ? 'false' : 'true');
      }

      toggle.addEventListener('click', function () {
        setOpen(!document.body.classList.contains('menu-open'));
      });
      menu.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () { setOpen(false); });
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
    })();
  </script>

</body>
</html>
